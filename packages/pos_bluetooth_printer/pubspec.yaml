environment:
  sdk: '>=3.11.4 <4.0.0'
  flutter: '>=3.41.6'
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: com.pos.printing
        pluginClass: PosBluetoothPrinterPlugin
