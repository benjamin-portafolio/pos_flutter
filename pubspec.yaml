name: pos_flutter
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.1
  path: ^1.8.3
  uuid: ^4.3.3
  get_it: ^7.6.0
  http: ^1.6.0
  socket_io_client: ^3.1.6
  connectivity_plus: ^7.2.0
  google_sign_in: ^7.2.0
  crypto: ^3.0.7
  sqlite3: ^3.3.4
  workmanager_android: ^0.9.0+2
  workmanager_platform_interface: ^0.9.1+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.14.0
  build_runner: ^2.4.6

dependency_overrides:
  # path_provider_foundation 2.6.x pulls objective_c native assets that are
  # currently packaged as iOS device binaries in iOS simulator builds.
  path_provider_foundation: 2.4.2

flutter:
  uses-material-design: true
